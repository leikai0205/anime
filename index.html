<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的動漫進度管理系統</title>
    <style>
        :root {
            --bg-color: #07090e;        /* 4K 劇院級極黑深色背景 */
            --card-bg: #111827;         /* 質感高冷深藍灰卡片 */
            --card-hover: #1f2937;      /* 卡片 hover 微亮 */
            --border-color: #1f2937;    /* 精緻邊框色 */
            --text-main: #f3f4f6;       /* 主文字高亮白 */
            --text-sub: #9ca3af;        /* 次要文字銀灰 */
            --accent-color: #38bdf8;    /* 科技感天空藍 */
            --today-border: #f43f5e;    /* 今日專屬玫瑰紅 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        header h1 { 
            color: var(--text-main); 
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
        }

        /* 控制列：選單與搜尋列 (置中優雅排版) */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: center;
        }
        select, .search-input {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        select:hover, .search-input:hover {
            border-color: #4b5563;
        }
        select:focus, .search-input:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
        .search-input {
            width: 300px;
        }

        /* 搜尋結果模式的季節標題提示 */
        .search-season-title {
            width: 100%;
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* 4K 垂直流暢單欄佈局 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-grow: 1;
            width: 100%;
        }
        
        /* 每一天的欄位：區塊化設計 */
        .day-column {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        /* 如果今天是當天，給予極具質感的特殊紅調邊框與微光 */
        .day-column.is-today {
            border: 1px solid var(--today-border);
            box-shadow: 0 10px 30px -5px rgba(244, 63, 94, 0.15);
            background: linear-gradient(145deg, #111827 0%, #161b22 100%);
        }

        .day-header {
            font-size: 1.15rem;
            font-weight: 600;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #27303f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e5e7eb;
        }

        .day-column.is-today .day-header {
            border-bottom-color: rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        .today-badge {
            background-color: var(--today-border);
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 動漫清單格狀排列 */
        .anime-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px; 
        }

        .anime-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px
