<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的動漫進度管理系統</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent-color: #38bdf8;
            --today-border: #f43f5e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--text-main); font-weight: 600; font-size: 1.8rem; margin: 0; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: center;
        }
        select, .search-input {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #374151;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input { width: 300px; }
        .search-season-title {
            width: 100%;
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-grow: 1;
            width: 100%;
        }
        .day-column {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 20px 24px;
            border: 1px solid var(--border-color);
        }
        .day-column.is-today {
            border: 1px solid var(--today-border);
            background: linear-gradient(145deg, #111827 0%, #161b22 100%);
        }
        .day-header {
            font-size: 1.15rem;
            font-weight: 600;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #27303f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e5e7eb;
        }
        .today-badge {
            background-color: var(--today-border);
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .anime-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px; 
        }
        .anime-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .anime-title { 
            font-size: 0.9rem; 
            line-height: 1.4; 
            flex-grow: 1; 
            color: var(--text-main);
            text-decoration: none;
        }
        .anime-title:hover { color: var(--accent-color); text-decoration: underline; }
        .ep-input-wrapper { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .ep-input-wrapper span { font-size: 0.8rem; color: var(--text-sub); }
        .ep-input {
            width: 50px;
            background-color: #030712;
            border: 1px solid #374151;
            color: white;
            text-align: center;
            padding: 6px 4px;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #1f2937;
            color: var(--text-sub);
            font-size: 0.85rem;
        }
        footer a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 我的動漫進度管理系統</h1>
    </header>

    <div class="controls">
        <select id="yearSelect" onchange="handleControlChange()"></select>
        <select id="seasonSelect" onchange="handleControlChange()">
            <option value="冬">冬番 (1-3月)</option>
            <option value="春">春番 (4-6月)</option>
            <option value="夏">夏番 (7-9月)</option>
            <option value="秋">秋番 (10-12月)</option>
        </select>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 輸入動漫名稱全站搜尋..." oninput="handleSearch()">
    </div>

    <div class="container" id="animeContainer">
        <p style="text-align: center; grid-column: 1/-1; color: var(--text-sub);">正在載入資料...</p>
    </div>

    <footer>
        資料參考與引用自 [Anime1.me](https://anime1.me/) 及其它公開資訊
    </footer>

    <script>
        function getDefaultYearAndSeason() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            let currentSeason = "冬";
            if (currentMonth >= 4 && currentMonth <= 6) currentSeason = "春";
            else if (currentMonth >= 7 && currentMonth <= 9) currentSeason = "夏";
            else if (currentMonth >= 10 && currentMonth <= 12) currentSeason = "秋";
            return { year: currentYear.toString(), season: currentSeason };
        }

        const defaultInfo = getDefaultYearAndSeason();
        const yearSelect = document.getElementById('yearSelect');
        const seasonSelect = document.getElementById('seasonSelect');

        const currentRealYear = new Date().getFullYear();
        for (let y = currentRealYear; y >= 2017; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y + " 年";
            if(y.toString() === defaultInfo.year) opt.selected = true;
            yearSelect.appendChild(opt);
        }
        seasonSelect.value = defaultInfo.season;

        let rawDatabaseAuto = {};
        let rawDatabaseManual = {};

        // 🛡️ 使用無敵防阻擋的 script 注入法（繞過 CORS 限制）
        function fetchSheetData() {
            const API_URL = "https://script.google.com/macros/s/AKfycbxDVeHWef6lwyEPUYavbJIGppFaJFL5IcirCcpoX1rifNDJD9WP4opQZnYvMGHnixQS/exec";
            
            // 先讀取快取秒開
            const cachedAuto = localStorage.getItem('cache_auto');
            const cachedManual = localStorage.getItem('cache_manual');
            if (cachedAuto) {
                rawDatabaseAuto = JSON.parse(cachedAuto);
                rawDatabaseManual = cachedManual ? JSON.parse(cachedManual) : {};
                updateView();
            }

            // 動態建立 script 標籤直接載入資料，絕不會被 CORS 卡住
            const script = document.createElement('script');
            script.src = `${API_URL}?callback=handleResponse`;
            document.body.appendChild(script);
        }

        // 接收 Google 回傳的資料
        function handleResponse(result) {
            rawDatabaseAuto = result.auto || {};
            rawDatabaseManual = result.manual || {};
            
            localStorage.setItem('cache_auto', JSON.stringify(rawDatabaseAuto));
            localStorage.setItem('cache_manual', JSON.stringify(rawDatabaseManual));
            
            updateView();
        }

        function handleControlChange() {
            document.getElementById('searchInput').value = "";
            updateView();
        }

        function getOrderedDays() {
            const allDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const todayIndex = new Date().getDay();
            let ordered = [];
            for (let i = 0; i < 7; i++) {
                ordered.push(allDays[(todayIndex + i) % 7]);
            }
            return ordered;
        }

        function updateView() {
            const year = yearSelect.value;
            const seasonKey = seasonSelect.value;
            
            let matchedSeasonName = "";
            let seasonData = null;

            for (let sName in rawDatabaseAuto) {
                if (sName.includes(year) && sName.includes(seasonKey)) {
                    matchedSeasonName = sName;
                    seasonData = rawDatabaseAuto[sName];
                    break;
                }
            }

            const isAutoEmpty = !seasonData || Object.keys(seasonData).every(day => seasonData[day].length === 0);
            
            if (isAutoEmpty) {
                for (let sName in rawDatabaseManual) {
                    if (sName.includes(year) && sName.includes(seasonKey)) {
                        matchedSeasonName = sName + " (手動補齊)";
                        seasonData = rawDatabaseManual[sName];
                        break;
                    }
                }
            }

            renderNormal(year, seasonKey, matchedSeasonName, seasonData);
        }

        function renderNormal(year, seasonKey, matchedSeasonName, seasonData) {
            const container = document.getElementById('animeContainer');
            const orderedDays = getOrderedDays();
            const todayName = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][new Date().getDay()];

            container.innerHTML = "";
            
            orderedDays.forEach(dayName => {
                const animeList = seasonData && seasonData[dayName] ? seasonData[dayName] : [];
                const isToday = (dayName === todayName);

                let htmlList = animeList.map((anime, index) => {
                    const safeKeyName = anime.title.replace(/[^\w\u4e00-\u9fa5]/g, "_");
                    const storageKey = `ep_${year}_${seasonKey}_${safeKeyName}`;
                    
                    const oldKey1 = `ep_${year}_${seasonKey}_${dayName}_${safeKeyName}`;
                    const oldKey2 = `ep_${matchedSeasonName}_${dayName}_${index}_${safeKeyName}`;
                    
                    let savedEp = localStorage.getItem(storageKey) || localStorage.getItem(oldKey1) || localStorage.getItem(oldKey2) || "";
                    
                    if (!localStorage.getItem(storageKey) && savedEp !== "") {
                        localStorage.setItem(storageKey, savedEp);
                    }

                    const titleHtml = anime.link 
                        ? `<a href="${anime.link}" target="_blank" class="anime-title">${anime.title}</a>`
                        : `<span class="anime-title">${anime.title}</span>`;

                    return `
                        <div class="anime-item">
                            ${titleHtml}
                            <div class="ep-input-wrapper">
                                <span>第</span>
                                <input type="number" class="ep-input" value="${savedEp}" placeholder="-" 
                                    oninput="saveProgress('${storageKey}', this.value)">
                                <span>集</span>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML += `
                    <div class="day-column ${isToday ? 'is-today' : ''}">
                        <div class="day-header">
                            <span>${dayName} (${animeList.length}部)</span>
                            ${isToday ? '<span class="today-badge">🔥 今日</span>' : ''}
                        </div>
                        <ul class="anime-list">${animeList.length > 0 ? htmlList : '<p style="color:var(--text-sub); font-size:0.85rem; text-align:center; margin:15px 0; grid-column: 1/-1;">此季度尚無資料</p>'}</ul>
                    </div>
                `;
            });
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('animeContainer');

            if (!keyword) {
                updateView();
                return;
            }

            container.innerHTML = "";
            let matchCount = 0;
            const combinedDatabases = { ...rawDatabaseManual, ...rawDatabaseAuto };

            for (let seasonName in combinedDatabases) {
                const seasonObj = combinedDatabases[seasonName];
                let extractedYear = "2026";
                let extractedSeason = "秋";
                for(let y = 2017; y <= 2030; y++) {
                    if(seasonName.includes(y)) extractedYear = y.toString();
                }
                if(seasonName.includes("冬")) extractedSeason = "冬";
                if(seasonName.includes("春")) extractedSeason = "春";
                if(seasonName.includes("夏")) extractedSeason = "夏";
                if(seasonName.includes("秋")) extractedSeason = "秋";

                let matchedItems = [];
                for (let day in seasonObj) {
                    seasonObj[day].forEach((anime, idx) => {
                        if (anime.title.toLowerCase().includes(keyword)) {
                            matchedItems.push({ ...anime, day: day, year: extractedYear, season: extractedSeason });
                        }
                    });
                }

                if (matchedItems.length > 0) {
                    matchCount++;
                    let seasonTitleDiv = document.createElement('div');
                    seasonTitleDiv.className = 'search-season-title';
                    seasonTitleDiv.innerText = `📂 ${seasonName} (找到 ${matchedItems.length} 部)`;
                    container.appendChild(seasonTitleDiv);

                    let resultsDiv = document.createElement('div');
                    resultsDiv.style.width = "100%";
                    resultsDiv.style.display = "grid";
                    resultsDiv.style.gridTemplateColumns = "repeat(auto-fill, minmax(260px, 1fr))";
                    resultsDiv.style.gap = "12px";
                    resultsDiv.style.marginBottom = "20px";

                    let htmlList = matchedItems.map(anime => {
                        const safeKeyName = anime.title.replace(/[^\w\u4e00-\u9fa5]/g, "_");
                        const storageKey = `ep_${anime.year}_${anime.season}_${safeKeyName}`;
                        const savedEp = localStorage.getItem(storageKey) || "";

                        const titleHtml = anime.link 
                            ? `<a href="${anime.link}" target="_blank" class="anime-title">${anime.title}</a>`
                            : `<span class="anime-title">${anime.title}</span>`;

                        return `
                            <div class="anime-item">
                                <div style="flex-grow:1; display:flex; flex-direction:column; gap:4px;">
                                    ${titleHtml}
                                    <span style="font-size: 0.75rem; color: var(--accent-color);">📅 ${anime.day}</span>
                                </div>
                                <div class="ep-input-wrapper">
                                    <span>第</span>
                                    <input type="number" class="ep-input" value="${savedEp}" placeholder="-" 
                                        oninput="saveProgress('${storageKey}', this.value)">
                                    <span>集</span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    resultsDiv.innerHTML = htmlList;
                    container.appendChild(resultsDiv);
                }
            }

            if (matchCount === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-sub); margin-top: 40px;">找不到與「${keyword}」相關的動漫作品。</p>`;
            }
        }

        function saveProgress(key, val) {
            if(val === "") localStorage.removeItem(key);
            else localStorage.setItem(key, val);
        }

        fetchSheetData();
    </script>
</body>
</html>
